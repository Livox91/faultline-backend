apiVersion: v1
kind: Namespace
metadata:
  name: faultline-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-demo
  namespace: faultline-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-demo
  template:
    metadata:
      labels:
        app: telemetry-demo
        app.kubernetes.io/name: telemetry-demo
        app.kubernetes.io/component: test-workload
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: faultline:dev
          imagePullPolicy: Never
          command: [node, /demo/demo.cjs]
          env:
            - name: MAX_MEMORY_MIB
              value: '24'
            - name: CPU_BUSY_MS
              value: '3'
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: code
              mountPath: /demo
              readOnly: true
            - name: control
              mountPath: /control
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      volumes:
        - name: code
          configMap:
            name: telemetry-demo-code
        - name: control
          emptyDir:
            sizeLimit: 1Mi
