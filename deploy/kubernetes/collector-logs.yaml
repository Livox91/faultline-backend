receivers:
  kubeletstats:
    collection_interval: 15s
    auth_type: serviceAccount
    endpoint: https://${env:KUBE_NODE_IP}:10250
    insecure_skip_verify: ${env:KUBELET_INSECURE_SKIP_VERIFY}
    metric_groups: [node, pod, container]
  filelog:
    include: [/var/log/pods/*/*/*.log]
    # Exclude collector and local Faultline output to prevent feedback loops.
    exclude: [/var/log/pods/faultline-system_*/*/*.log]
    start_at: end
    include_file_path: true
    max_log_size: 16KiB
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    operators:
      - type: container
        id: container-parser
        max_log_size: 16KiB
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 2s
    send_batch_size: 32
    send_batch_max_size: 32
  k8sattributes:
    auth_type: serviceAccount
    filter:
      node_from_env_var: KUBE_NODE_NAME
    extract:
      deployment_name_from_replicaset: false
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.container.name
        - container.id
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.job.name
      labels:
        - tag_name: k8s.pod.label.app.kubernetes.io/name
          key: app.kubernetes.io/name
          from: pod
        - tag_name: k8s.pod.label.app.kubernetes.io/component
          key: app.kubernetes.io/component
          from: pod
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
  resource/cluster:
    attributes:
      - key: faultline.cluster.id
        value: ${env:FAULTLINE_CLUSTER_ID}
        action: upsert
      - key: k8s.node.name
        value: ${env:KUBE_NODE_NAME}
        action: insert
exporters:
  otlp_http/faultline:
    metrics_endpoint: ${env:FAULTLINE_METRICS_ENDPOINT}
    logs_endpoint: ${env:FAULTLINE_LOGS_ENDPOINT}
    encoding: json
    compression: gzip
    headers:
      X-Faultline-Cluster-ID: ${env:FAULTLINE_CLUSTER_ID}
      X-Faultline-Agent-Token: ${env:FAULTLINE_AGENT_TOKEN}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 128
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, k8sattributes, resource/cluster, batch]
      exporters: [otlp_http/faultline]

    metrics:
      receivers: [kubeletstats]
      processors: [memory_limiter, k8sattributes, resource/cluster, batch]
      exporters: [otlp_http/faultline]
