apiVersion: v1
kind: ServiceAccount
metadata:
  name: faultline-logs
  namespace: faultline-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: faultline-events
  namespace: faultline-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: faultline-logs
rules:
  # Pod enrichment and read-only kubelet /stats/summary.
  - apiGroups: ['']
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [nodes/stats]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: faultline-events
rules:
  # Event watch, workload snapshots and the cluster receiver informers. No secrets or writes.
  - apiGroups: ['']
    resources:
      [
        events,
        pods,
        nodes,
        namespaces,
        replicationcontrollers,
        resourcequotas,
        services,
      ]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: faultline-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: faultline-logs
subjects:
  - kind: ServiceAccount
    name: faultline-logs
    namespace: faultline-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: faultline-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: faultline-events
subjects:
  - kind: ServiceAccount
    name: faultline-events
    namespace: faultline-system
