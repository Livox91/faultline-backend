apiVersion: v1
kind: Namespace
metadata:
  name: faultline-onboarding
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faultline-log-test
  namespace: faultline-onboarding
  labels:
    app.kubernetes.io/name: faultline-log-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: faultline-log-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faultline-log-test
        app.kubernetes.io/component: onboarding
    spec:
      automountServiceAccountToken: false
      containers:
        - name: log-test
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              while true; do
                echo "FAULTLINE_ONBOARDING_TEST"
                echo "database connection refused FAULTLINE_ONBOARDING_CLASSIFICATION_TEST" >&2
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
